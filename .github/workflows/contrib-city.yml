name: Contribution City

on:
  schedule:
    - cron: "17 3 * * *" # every day at 03:17 UTC
  workflow_dispatch: # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - .github/scripts/contrib-city.mjs
      - .github/workflows/contrib-city.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Render SVG
        run: node .github/scripts/contrib-city.mjs --out profile/contrib-city.svg
        env:
          # Built-in token is enough for public contributions. To count private
          # ones, turn on "Private contributions" in your profile settings.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          CITY_THEME: teal # teal | green | violet | amber
          CITY_TITLE: Contribution City

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/contrib-city.svg
          git diff --staged --quiet || git commit -m "Update contribution city"
          git push
